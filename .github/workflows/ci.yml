name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Hosted runners have no GPU, so CI covers the CPU-side Python code. GPU tests run locally.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch and the other requirements
        run: |
          pip install torch==$(grep '^torch==' requirements.txt | cut -d= -f3) \
            torchvision==$(grep '^torchvision==' requirements.txt | cut -d= -f3) \
            --index-url https://download.pytorch.org/whl/cpu
          pip install $(grep -v -E '^(torch|torchvision)==' requirements.txt | grep -v '^#')
          pip install -e .
      - name: Test
        run: python -m pytest -q

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: shellcheck
        run: shellcheck scripts/*.sh bench/*.sh
